<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Form Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      padding: 20px;
    }
    
    .header {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .header h1 {
      font-size: 18px;
      margin-bottom: 5px;
      color: #667eea;
    }
    
    .header p {
      font-size: 12px;
      color: #666;
    }
    
    .content {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-height: 150px;
    }
    
    .form-info {
      margin-bottom: 15px;
    }
    
    .form-info p {
      font-size: 14px;
      margin-bottom: 8px;
      color: #555;
    }
    
    .form-fields {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .validate-btn {
      background: #667eea;
      color: white;
    }
    
    .validate-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .open-app-btn {
      background: #10b981;
      color: white;
    }
    
    .open-app-btn:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    
    .status {
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    
    .status.error {
      background: #fee2e2;
      color: #7f1d1d;
    }
    
    .status.loading {
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 Form Validator</h1>
      <p>Validate forms with AI</p>
    </div>
    
    <div class="content">
      <div class="form-info">
        <p><strong>Forms Found:</strong> <span id="formCount">0</span></p>
        <div class="form-fields" id="formsList">Scanning for forms...</div>
      </div>
      
      <div class="button-group">
        <button class="validate-btn" onclick="validateForm()">✓ Validate</button>
        <button class="open-app-btn" onclick="openApp()">→ Open App</button>
      </div>
      
      <div class="status" id="status" style="display: none;"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
